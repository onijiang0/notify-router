services:
  notify-router:
    build: .
    image: notify-router:latest
    container_name: notify-router
    restart: unless-stopped
    # 宿主机端口 18081 → 容器 8080。部署后访问 http://<服务器IP>:18081
    ports:
      - "18081:8080"
    environment:
      # 容器内监听端口(与上方端口映射右侧保持一致; 也可在 UI「系统设置」改, 需同步映射)
      LISTEN_PORT: "8080"

      # ────────────────────────────────────────────────────────────────
      # Web 管理界面登录鉴权(强烈建议开启)
      #   AUTH_USER 与 AUTH_PASS 同时非空 → 开启登录; 都留空 → 不鉴权(仅适合纯内网)。
      #   /notify 与 /health 永远公开, 脚本投递不受影响。
      #   改密码 = 改这里后重建容器(会话存内存, 重启即失效)。
      # ────────────────────────────────────────────────────────────────
      AUTH_USER: "${AUTH_USER:-}"
      AUTH_PASS: "${AUTH_PASS:-}"

      # ────────────────────────────────────────────────────────────────
      # 首次启动播种渠道(可选)
      #   下面三个是【空占位】, 只在首次启动且尚无 config.json 时用来生成渠道;
      #   之后所有渠道/规则都在 Web UI 改, 持久化到 /app/config/config.json。
      #   需要用环境变量注入凭据时, 写进同目录的 .env 文件(已被 .gitignore 忽略),
      #   千万不要把真实 key 提交进 Git。
      # ────────────────────────────────────────────────────────────────
      QYWX_KEY: "${QYWX_KEY:-}"
      DINGTALK_ACCESS_TOKEN: "${DINGTALK_ACCESS_TOKEN:-}"
      DINGTALK_SECRET: "${DINGTALK_SECRET:-}"

      # 无规则命中时: true=发全部启用渠道; false=不发
      FALLBACK_ALL: "true"

      # ────────────────────────────────────────────────────────────────
      # (可选) Gist 云备份: 卷丢失后自动从云端恢复配置, 详见 README
      # ────────────────────────────────────────────────────────────────
      # GIST_TOKEN: "${GIST_TOKEN:-}"
      # GIST_ID: "${GIST_ID:-}"
    volumes:
      # 配置持久化: Web UI 保存的渠道/规则/美化写到这里, 重启不丢
      - notify-router-config:/app/config
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.LISTEN_PORT||8080)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  notify-router-config:
